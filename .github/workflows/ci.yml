name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application
        run: python -c "from app import app; print('Application import successful')"

      - name: Build Docker image
        run: docker build -t complete-devops-pipeline:ci .
