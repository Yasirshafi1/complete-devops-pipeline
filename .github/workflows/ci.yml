name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t yasirshafi1/complete-devops-pipeline:${{ github.sha }} .

      - name: Push Docker image
        run: docker push yasirshafi1/complete-devops-pipeline:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yasirshafi1/complete-devops-pipeline:${{ github.sha }}

            docker stop devops-dashboard || true
            docker rm devops-dashboard || true

            docker run -d \
              --name devops-dashboard \
              --restart unless-stopped \
              -p 5000:5000 \
              yasirshafi1/complete-devops-pipeline:${{ github.sha }}
